# All-local setting for the efficient-RSI experiments: one Qwen3-Coder-30B-A3B (FP8)
# served by vLLM on a single H100 plays every role. No API calls.
# hgm.py and final_eval.py both read models from here, so pass --config config_local.yaml
# to both (final_eval.py has no per-model flags).

llm:
  self_improve_llm: "vllm-qwen3c-local"
  downstream_llm: "vllm-qwen3c-local"
  diagnose_llm: "vllm-qwen3c-local"

optimization:
  alpha: 0.6
  beta: 1.0
  cool_down: false
  eval_random_level: 1.0
  n_pseudo_descendant_evals: 10000

execution:
  max_workers: 20
  self_improve_timeout: 3600
  evaluation_timeout: 3600
  max_task_evals: 800

evaluation:
  full_eval: false
  polyglot: true

paths:
  output_dir: null
  continue_from: null
  initial_agent_name: "default_agent"
