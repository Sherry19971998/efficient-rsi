# harness-rsi arms with LC_MODEL=qwen35-9b: RedHatAI/Qwen3.5-9B-FP8-dynamic on vLLM, served as
# vllm-qwen3.5-9b, for small tests on one A100 (the model of the ICRN experiments). Same as
# config_local_lc.yaml except the model name and the initial agent directory (lc_agent_qwen35).

llm:
  self_improve_llm: "vllm-qwen3.5-9b"
  downstream_llm: "vllm-qwen3.5-9b"
  diagnose_llm: "vllm-qwen3.5-9b"

optimization:
  alpha: 0.6
  beta: 1.0
  cool_down: false
  eval_random_level: 1.0
  n_pseudo_descendant_evals: 10000

execution:
  max_workers: 20
  self_improve_timeout: 3600
  evaluation_timeout: 3600
  max_task_evals: 800

evaluation:
  full_eval: false
  polyglot: true

paths:
  output_dir: null
  continue_from: null
  initial_agent_name: "lc_agent_qwen35"
